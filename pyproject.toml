[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-culture-cartographer"
version = "0.1.0"
description = "Traceable visual readings informed by Peircean semiotics"
requires-python = ">=3.11"
dependencies = ["streamlit>=1.45,<2", "openai>=2,<3", "Pillow>=11,<13", "jsonschema>=4,<5", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
graphic_culture_atlas = ["prompts/*.md", "schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
