[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-rhetoric-atlas"
version = "0.1.0"
description = "A traceable visual-rhetoric corpus and data-mining pipeline"
requires-python = ">=3.11"
dependencies = ["openai>=2,<3", "Pillow>=11,<13", "jsonschema>=4,<5"]

[project.scripts]
visual-rhetoric-atlas = "visual_rhetoric_atlas.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
visual_rhetoric_atlas = ["knowledge/resources/prompts/*.md", "knowledge/resources/schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
